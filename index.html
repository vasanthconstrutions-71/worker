<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vasant Constructions - Management System</title>
  <!-- Tailwind CSS CDN for styling & responsiveness -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased text-slate-800">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 p-2.5 rounded-lg text-slate-900 font-bold">
          <i class="fa-solid fa-helmet-safety text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide uppercase text-amber-500">
            Vasant Constructions
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 font-medium">Management System</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-16 flex-grow w-full flex flex-col justify-center">
    
    <!-- BUTTON BOXES GRID (Responsive: 1 col on mobile, 3 cols on tablets/laptops) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-5xl mx-auto w-full">
      
      <!-- BUTTON 1: PROJECTS -->
      <a href="project.html" 
         class="group bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-amber-500 transition-all duration-300 flex flex-col items-center justify-center text-center">
        <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-amber-500 group-hover:text-white transition-all duration-300">
          <i class="fa-solid fa-building-user text-3xl sm:text-4xl"></i>
        </div>
        <h3 class="text-2xl font-bold text-slate-900 group-hover:text-amber-600 transition-colors">Projects</h3>
      </a>

      <!-- BUTTON 2: ATTENDANCE -->
      <a href="attendance.html" 
         class="group bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-emerald-500 transition-all duration-300 flex flex-col items-center justify-center text-center">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-emerald-500 group-hover:text-white transition-all duration-300">
          <i class="fa-solid fa-clipboard-user text-3xl sm:text-4xl"></i>
        </div>
        <h3 class="text-2xl font-bold text-slate-900 group-hover:text-emerald-600 transition-colors">Attendance</h3>
      </a>

      <!-- BUTTON 3: WORKERS -->
      <a href="worker.html" 
         class="group bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-500 transition-all duration-300 flex flex-col items-center justify-center text-center">
        <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300">
          <i class="fa-solid fa-users-gear text-3xl sm:text-4xl"></i>
        </div>
        <h3 class="text-2xl font-bold text-slate-900 group-hover:text-blue-600 transition-colors">Workers</h3>
      </a>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs sm:text-sm border-t border-slate-800">
    <p>© Vasant Constructions. All Rights Reserved.</p>
  </footer>

</body>
</html>
