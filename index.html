<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vasant Constructions - Worker Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #eef2f6;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    header {
      background-color: #0b1329;
      padding: 12px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      background-color: #f59e0b;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0b1329;
    }

    .brand-logo svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-badge {
      font-size: 13px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .btn-logout {
      background-color: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }

    /* Main Dashboard Layout */
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cards-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
    }

    .action-card {
      background: #ffffff;
      width: 260px;
      height: 180px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #e2e8f0;
    }

    .action-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .card-icon-box {
      width: 56px;
      height: 56px;
      background-color: #fef3c7;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-icon-box svg {
      width: 30px;
      height: 30px;
      fill: #d97706;
    }

    .card-icon-box.attendance-icon {
      background-color: #dcfce7;
    }

    .card-icon-box.attendance-icon svg {
      fill: #15803d;
    }

    .action-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Footer */
    footer {
      background-color: #0b1329;
      color: #64748b;
      text-align: center;
      padding: 12px;
      font-size: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Login Modal Overlay */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b1329;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .login-card h2 {
      margin-bottom: 6px;
      color: #0b1329;
      font-size: 22px;
      text-align: center;
      font-weight: 800;
    }

    .login-card p {
      color: #64748b;
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #475569;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #f59e0b;
    }

    .btn-login {
      width: 100%;
      background: #0b1329;
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #1e293b;
    }

    .error-msg {
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Worker Dashboard Content -->
  <div id="appContent" style="display: none; height: 100vh; flex-direction: column;">
    <header>
      <div class="brand-container">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 0 0-9 9v1h18v-1a9 9 0 0 0-9-9zm-1 12H2v2a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2h-9z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>VASANT CONSTRUCTIONS</h1>
          <span>Management System</span>
        </div>
      </div>

      <div class="header-actions">
        <span class="user-badge" id="userBadge">Worker</span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="main-container">
      <div class="cards-grid">
        <a href="project.html" class="action-card">
          <div class="card-icon-box">
            <svg viewBox="0 0 24 24">
              <path d="M19 2H9c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 18v-2h2v2H9zm0-4v-2h2v2H9zm0-4V8h2v2H9zm0-4V4h2v2H9zm4 12v-2h2v2h-2zm0-4v-2h2v2h-2zm0-4V8h2v2h-2zm0-4V4h2v2h-2zm4 12v-2h2v2h-2zm0-4v-2h2v2h-2zm0-4V8h2v2h-2zm0-4V4h2v2h-2zM3 6h2v14H3z"/>
            </svg>
          </div>
          <h3>Projects</h3>
        </a>

        <a href="attendance.html" class="action-card">
          <div class="card-icon-box attendance-icon">
            <svg viewBox="0 0 24 24">
              <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/>
            </svg>
          </div>
          <h3>Attendance</h3>
        </a>
      </div>
    </main>

    <footer>
      © Vasant Constructions. All Rights Reserved.
    </footer>
  </div>

  <!-- Login Overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>Worker Login</h2>
      <p>Enter your Worker ID and Password</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="loginId">WORKER ID</label>
          <input type="text" id="loginId" maxlength="4" placeholder="e.g., W102" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">PASSWORD</label>
          <input type="password" id="loginPassword" maxlength="4" placeholder="e.g., 1234" required />
        </div>

        <button type="submit" class="btn-login">Login</button>
        <div class="error-msg" id="loginError">Invalid ID or Password!</div>
      </form>
    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0xLiByPlm4EGEHdxg77ylFswxgKQRnIo",
      authDomain: "vasanthconstrutions-19c6f.firebaseapp.com",
      databaseURL: "https://vasanthconstrutions-19c6f-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "vasanthconstrutions-19c6f",
      storageBucket: "vasanthconstrutions-19c6f.firebasestorage.app",
      messagingSenderId: "677215073901",
      appId: "1:677215073901:web:d18cc1cc3ade5f34fd7164"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const workersRef = ref(db, 'worker_ids');

    const loginOverlay = document.getElementById('loginOverlay');
    const appContent = document.getElementById('appContent');
    const loginForm = document.getElementById('loginForm');
    const loginIdInput = document.getElementById('loginId');
    const loginPasswordInput = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const userBadge = document.getElementById('userBadge');
    const logoutBtn = document.getElementById('logoutBtn');

    let allWorkers = {};

    loginIdInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    loginPasswordInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    onValue(workersRef, (snapshot) => {
      allWorkers = snapshot.val() || {};
      verifySession();
    });

    function verifySession() {
      const activeWorker = JSON.parse(localStorage.getItem('activeWorkerSession'));

      if (!activeWorker) {
        showLogin();
        return;
      }

      let foundWorker = null;

      Object.keys(allWorkers).forEach(key => {
        const w = allWorkers[key];
        if (w.workerId === activeWorker.workerId && w.password === activeWorker.password) {
          foundWorker = w;
        }
      });

      if (!foundWorker) {
        logoutWorker();
      } else {
        showDashboard(foundWorker);
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginError.style.display = 'none';

      const inputId = loginIdInput.value.trim();
      const inputPwd = loginPasswordInput.value.trim();

      let matchedWorker = null;

      Object.keys(allWorkers).forEach(key => {
        const w = allWorkers[key];
        if (w.workerId === inputId && w.password === inputPwd) {
          matchedWorker = w;
        }
      });

      if (matchedWorker) {
        localStorage.setItem('activeWorkerSession', JSON.stringify({
          workerId: matchedWorker.workerId,
          password: matchedWorker.password,
          name: matchedWorker.name
        }));

        showDashboard(matchedWorker);
        loginForm.reset();
      } else {
        loginError.style.display = 'block';
      }
    });

    function showDashboard(worker) {
      loginOverlay.style.display = 'none';
      appContent.style.display = 'flex';
      
      // Displays only Worker Name and Worker ID
      const displayName = worker.name ? worker.name : "Worker";
      userBadge.innerText = `${displayName} (${worker.workerId})`;
    }

    function showLogin() {
      appContent.style.display = 'none';
      loginOverlay.style.display = 'flex';
    }

    function logoutWorker() {
      localStorage.removeItem('activeWorkerSession');
      showLogin();
    }

    logoutBtn.addEventListener('click', logoutWorker);
  </script>
</body>
</html>
